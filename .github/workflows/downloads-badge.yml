name: Downloads badge

# Sums all-time PyPI + npm downloads and writes a shields.io endpoint JSON
# to the unprotected `badges` branch (installs.json at its root), which the
# README badge and the website both read. Keyless: PyPI total comes from the
# public ClickHouse pypi dataset, npm from the registry downloads API. Runs
# hourly and on demand so the "live downloads" count stays fresh. It commits
# only when the number changes, so quiet hours produce no churn. It publishes
# to `badges` rather than `main` because the main ruleset requires a pull
# request, which a bot push cannot satisfy.
#
# Hourly is the freshest reliable cadence here: PyPI's all-time source
# (ClickHouse) sends no CORS header, so a browser cannot read it directly and
# a true per-visit count would need a standalone proxy. This endpoint JSON is
# the single source both the shield and the site consume, so they stay in sync.

on:
  schedule:
    - cron: "0 * * * *"   # top of every hour, UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the badges branch
        uses: actions/checkout@v4
        with:
          ref: badges

      # The badge geometry lives in scripts/render_conformance_page.py on main.
      # This job used to carry a second renderer written in shell, and the two
      # drifted: this one still put white on brand green at 2.92:1, the contrast
      # failure the Python one fixed in August, and it forced the glyph width.
      - name: Check out main for the badge renderer
        uses: actions/checkout@v4
        with:
          ref: main
          path: .renderer
          sparse-checkout: scripts/render_conformance_page.py
          sparse-checkout-cone-mode: false

      - name: Compute installs and render self-hosted badge SVGs
        run: |
          set -euo pipefail

          # PyPI all-time (keyless, public ClickHouse pypi dataset)
          pypi=$(curl -s -m 30 "https://sql-clickhouse.clickhouse.com/?user=play" \
            --data-binary "SELECT sum(count) FROM pypi.pypi_downloads WHERE project='vaara' FORMAT TabSeparated" || echo 0)

          # npm all-time (registry downloads API; start date predates first publish)
          npm=$(curl -s -m 30 "https://api.npmjs.org/downloads/point/2020-01-01:$(date +%F)/@vaara/client" \
            | jq -r '.downloads // 0' || echo 0)

          # PyPI current version (keyless public JSON API). Self-hosting this badge
          # too removes the shields.io dependency that used to break the version pill.
          version=$(curl -s -m 30 "https://pypi.org/pypi/vaara/json" | jq -r '.info.version // empty' || echo "")

          pypi=${pypi//[^0-9]/}; npm=${npm//[^0-9]/}
          pypi=${pypi:-0}; npm=${npm:-0}
          total=$(( pypi + npm ))
          echo "pypi=$pypi npm=$npm total=$total version=${version:-none}"

          # One renderer for every shield the project publishes.
          render_badge() { # $1=label $2=message $3=hexcolor $4=outfile
            python3 .renderer/scripts/render_conformance_page.py \
              --badge "$1" "$2" "#$3" "$4"
          }

          # Version badge: render whenever PyPI returns a version, independent of
          # the downloads fetch so a slow ClickHouse never staleness-locks it.
          if [ -n "${version:-}" ]; then
            render_badge "pypi" "v${version}" "007ec6" pypi.svg
            echo "wrote pypi.svg (v${version})"
          fi

          # Safety: never overwrite a good number with a failed fetch
          if [ "$total" -lt 1000 ]; then
            echo "total=$total looks wrong, leaving the downloads badge untouched"; exit 0
          fi

          # Only rewrite when the number actually moved. The timestamp is
          # bumped alongside the total, so "updated N ago" on the site tracks
          # when the count last changed instead of churning the branch hourly.
          old=$(jq -r '.total // 0' installs.json 2>/dev/null || echo 0)
          if [ "$total" = "$old" ] && [ -f downloads.svg ]; then
            echo "total unchanged at $total, leaving the downloads badge untouched"; exit 0
          fi

          msg=$(awk -v n="$total" 'BEGIN{ if (n>=1000) printf "%.1fk all-time", n/1000; else printf "%d all-time", n }')
          gen=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","total":%d,"color":"4A6E5C","generated":"%s"}\n' "$msg" "$total" "$gen" \
            > installs.json
          render_badge "downloads" "$msg" "4A6E5C" downloads.svg
          cat installs.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installs.json pypi.svg downloads.svg 2>/dev/null || git add installs.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(badge): refresh install count and version badges"
            git push origin HEAD:badges
          fi
