name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned deps
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Install Vaara (editable, no deps)
        run: pip install -e . --no-deps

      - name: Install server extra (fastapi, uvicorn, httpx) for HTTP transport tests
        run: pip install 'fastapi>=0.110' 'uvicorn>=0.27' 'httpx>=0.27'

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q

  adapter-contracts:
    name: Cloud adapter contracts
    runs-on: ubuntu-latest
    # The per-adapter tests in the main job build fixtures by hand, in the
    # shape Vaara assumes the provider returns, so they pass even when the
    # assumption is wrong. This job installs the real provider SDKs and
    # checks the adapters against the contracts those SDKs describe about
    # themselves. Offline: no credentials, no provider API calls.
    #
    # The SDKs are deliberately not in requirements-dev.txt. They are
    # optional extras, and pulling boto3, azure-core and google-cloud into
    # the hash-pinned dev lock would slow every matrix leg of the main job.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Vaara and the provider SDKs
        run: |
          pip install -e . --no-deps
          pip install pytest boto3 azure-ai-contentsafety google-cloud-modelarmor rebuff

      - name: Run contract tests, failing on any skip
        # Each contract class skips when its SDK is missing. In this job an
        # SDK is always installed, so a skip means the import broke and the
        # contracts went unchecked. Silence is exactly the failure mode this
        # job exists to prevent, so a skip is an error here.
        run: |
          set -o pipefail
          pytest tests/test_integrations_cloud_contracts.py -q -rs | tee result.txt
          if grep -qE '[0-9]+ skipped' result.txt; then
            echo "::error::A contract test skipped, so a provider SDK did not import."
            exit 1
          fi

  framework-contracts:
    name: Agent framework contracts
    runs-on: ubuntu-latest
    # Separate from adapter-contracts on purpose. rebuff pins an old
    # langchain that still ships langchain_core.pydantic_v1, so installing
    # it alongside a current langchain-core resolves to a version where
    # one of the two cannot import. Keeping the sets apart means each
    # contract runs against the version a deployer would actually have.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Vaara and the framework SDKs
        run: |
          pip install -e . --no-deps
          pip install pytest langchain-core openai-agents

      - name: Run framework contract tests, failing on any skip
        run: |
          set -o pipefail
          pytest tests/test_integrations_langchain_protocol.py \
                 tests/test_integrations_openai_agents_contract.py -q -rs | tee result.txt
          if grep -qE '[0-9]+ skipped' result.txt; then
            echo "::error::A contract test skipped, so a framework SDK did not import."
            exit 1
          fi

  classifier:
    name: Adversarial classifier (shipped model)
    runs-on: ubuntu-latest
    # The shipped bundle had zero executed pytest coverage anywhere. Every
    # classifier test skips in the main matrix because requirements-dev.txt
    # carries no xgboost and no joblib, and the only thing touching the model
    # was four smoke cases in preflight.sh.
    #
    # They stay out of that lock on purpose. Loading the bundle needs xgboost
    # and joblib, but scoring through it needs sentence-transformers too (v0.32
    # and later bundles carry embedding features), and that pulls torch. Paying
    # for torch on four matrix legs to exercise one artefact is not worth it,
    # and xgboost alone pulls nvidia-nccl on linux x86_64.
    #
    # So the coverage lives here instead: real extras, the real shipped bundle,
    # and no skip tolerated. Note this job reaches huggingface.co on the first
    # score() to fetch all-MiniLM-L6-v2 at its pinned revision, the same
    # exposure preflight.sh already has.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Vaara with the ml extras
        run: |
          pip install -e '.[ml]'
          pip install pytest

      - name: Run classifier tests, failing on any skip
        # With [ml] installed nothing in these two files has a reason to
        # skip, so a skip means an import broke and the model went unchecked.
        run: |
          set -o pipefail
          pytest tests/test_adversarial_classifier_integration.py \
                 tests/test_bundle_integrity.py -q -rs | tee result.txt
          if grep -qE '[0-9]+ skipped' result.txt; then
            echo "::error::A classifier test skipped, so the shipped model went untested."
            exit 1
          fi

  no-private-keys:
    name: No private key material in the history
    runs-on: ubuntu-latest
    # v0.42.0 committed four private conformance-vector keys. PR #201 deleted
    # them from HEAD with the note "verification unaffected, public-key only",
    # which was true of the checkout and missed that git keeps the blobs. They
    # stayed pullable for 73 days and still matched the public keys shipping at
    # HEAD, so anyone could mint a vector that verified against them.
    #
    # A check that reads the working tree would have passed every day of that.
    # This one walks each commit the pull request adds and inspects the blobs
    # that commit introduces, so adding a key and deleting it in the next
    # commit fails the same way as leaving it in.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # the range walk needs the base commit

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install cryptography
        # Detection parses the candidate rather than matching a header, so a
        # deliberately malformed PEM in a negative test does not trip it.
        run: pip install 'cryptography>=42'

      - name: Scan the commits this pull request adds
        if: github.event_name == 'pull_request'
        run: |
          python scripts/check_no_private_keys.py \
            --range ${{ github.event.pull_request.base.sha }}..HEAD

      - name: Scan the tree
        run: python scripts/check_no_private_keys.py --tree

  signing-extras:
    name: Signing extras (attestation, scitt, timeanchor, pq, yaml)
    runs-on: ubuntu-latest
    # requirements-dev.txt is compiled --extra=dev --extra=export, and export
    # is cryptography alone. So the main matrix installs almost no optional
    # dependency and every test gated on one skips. Measured on a clean 3.12:
    # 164 reported skips, but pytest counts a module-level skip as one, and 93
    # test modules are guarded at import time. Those 93 hold 1061 test
    # functions, so roughly a third of the suite never ran anywhere.
    #
    # This job covers the signing-critical part of that: canonicalization
    # (rfc8785), attestation and SCITT (cbor2), RFC 3161 time anchors
    # (asn1crypto), post-quantum signatures (dilithium-py) and policy YAML.
    # 61 test files were gated on these. All are cheap, none pull torch.
    #
    # The check greps skip reasons rather than pinning a file list, so a new
    # module gated on one of these dependencies is caught without editing the
    # job, and the job cannot silently rot into passing on an empty run.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned deps
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Install Vaara with the signing extras
        run: pip install -e '.[attestation,scitt,timeanchor,pq,yaml]'

      - name: Run tests, failing on any skip these extras should have prevented
        run: |
          set -o pipefail
          pytest -q -rs | tee result.txt
          COVERED='rfc8785|cbor2|asn1crypto|dilithium|yaml|attestation extra|timeanchor extra|pq extra'
          if grep '^SKIPPED' result.txt | grep -qiE "$COVERED"; then
            echo "::error::A test skipped for a dependency this job installs, so signing-critical code went unexecuted."
            grep '^SKIPPED' result.txt | grep -iE "$COVERED"
            exit 1
          fi

  typecheck:
    name: Type check (mypy strict set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install mypy
        run: pip install mypy==1.20.2

      # Strict set only (vaara.policy.*, per [[tool.mypy.overrides]] in
      # pyproject.toml). Non-zero exit fails the build. Widen the set by
      # adding modules to the strict override block as they are cleaned up.
      - name: mypy
        run: mypy src/vaara/policy/

  preflight:
    name: Pre-release smoke test (wheel + classifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run preflight smoke test
        run: ./scripts/preflight.sh
