name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned deps
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Install Vaara (editable, no deps)
        run: pip install -e . --no-deps

      - name: Install server extra (fastapi, uvicorn, httpx) for HTTP transport tests
        run: pip install 'fastapi>=0.110' 'uvicorn>=0.27' 'httpx>=0.27'

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q

  adapter-contracts:
    name: Cloud adapter contracts
    runs-on: ubuntu-latest
    # The per-adapter tests in the main job build fixtures by hand, in the
    # shape Vaara assumes the provider returns, so they pass even when the
    # assumption is wrong. This job installs the real provider SDKs and
    # checks the adapters against the contracts those SDKs describe about
    # themselves. Offline: no credentials, no provider API calls.
    #
    # The SDKs are deliberately not in requirements-dev.txt. They are
    # optional extras, and pulling boto3, azure-core and google-cloud into
    # the hash-pinned dev lock would slow every matrix leg of the main job.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Vaara and the provider SDKs
        run: |
          pip install -e . --no-deps
          pip install pytest boto3 azure-ai-contentsafety google-cloud-modelarmor rebuff

      - name: Run contract tests, failing on any skip
        # Each contract class skips when its SDK is missing. In this job an
        # SDK is always installed, so a skip means the import broke and the
        # contracts went unchecked. Silence is exactly the failure mode this
        # job exists to prevent, so a skip is an error here.
        run: |
          set -o pipefail
          pytest tests/test_integrations_cloud_contracts.py -q -rs | tee result.txt
          if grep -qE '[0-9]+ skipped' result.txt; then
            echo "::error::A contract test skipped, so a provider SDK did not import."
            exit 1
          fi

  framework-contracts:
    name: Agent framework contracts
    runs-on: ubuntu-latest
    # Separate from adapter-contracts on purpose. rebuff pins an old
    # langchain that still ships langchain_core.pydantic_v1, so installing
    # it alongside a current langchain-core resolves to a version where
    # one of the two cannot import. Keeping the sets apart means each
    # contract runs against the version a deployer would actually have.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Vaara and the framework SDKs
        run: |
          pip install -e . --no-deps
          pip install pytest langchain-core openai-agents

      - name: Run framework contract tests, failing on any skip
        run: |
          set -o pipefail
          pytest tests/test_integrations_langchain_protocol.py \
                 tests/test_integrations_openai_agents_contract.py -q -rs | tee result.txt
          if grep -qE '[0-9]+ skipped' result.txt; then
            echo "::error::A contract test skipped, so a framework SDK did not import."
            exit 1
          fi

  typecheck:
    name: Type check (mypy strict set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install mypy
        run: pip install mypy==1.20.2

      # Strict set only (vaara.policy.*, per [[tool.mypy.overrides]] in
      # pyproject.toml). Non-zero exit fails the build. Widen the set by
      # adding modules to the strict override block as they are cleaned up.
      - name: mypy
        run: mypy src/vaara/policy/

  preflight:
    name: Pre-release smoke test (wheel + classifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run preflight smoke test
        run: ./scripts/preflight.sh
