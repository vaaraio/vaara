name: Conformance desk

# Self-service desk for Vaara Conformance Results.
#
# Someone runs the independent checkers, files the conformance-row issue form,
# and this decides the row. Nothing reaches a human unless it argues back.
#
# It writes to the unprotected `vcr` branch rather than to main, for the same
# reason downloads-badge.yml writes to `badges`: the main ruleset requires a
# pull request, and a submitter should never need write access, a fork, or a
# PR to appear on a results table. Main holds the code and the rules. The `vcr`
# branch holds submitted rows, their badges and the rendered page, and the
# Pages job overlays them at publish time.
#
# Every field is checked by scripts/vcr_row.py before anything is written. What
# it cannot check is whether the linked record honestly says what the submitter
# claims, and it does not pretend to: a row is that party's claim, quoted, next
# to their own public link, on a page where every verdict recomputes from
# committed bytes. A reader who doubts a row can disprove it without asking.

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to process again
        required: true
  # The corpus shield states the size of the corpus and how much of it fails,
  # and until now it was only ever regenerated by a submission. So adding a
  # suite left the published shield reporting the old count until some stranger
  # happened to file a row, and the gap was open for as long as nobody applied.
  # A shield that tracks submissions instead of the thing it measures cannot be
  # kept honest by remembering to run something.
  push:
    branches: [main]
    paths:
      - "tests/vectors/**"
      - "scripts/render_conformance_page.py"
      - "scripts/conformance_runner.py"

permissions:
  contents: write
  issues: write
  # The last step dispatches pages.yml so the row this run just published is
  # actually served. Dispatching a workflow needs `actions: write`, which was
  # missing, so on row #1 the API returned 403, the site was never rebuilt, and
  # the submitter got a comment congratulating him next to a badge URL that
  # returned 404 for an hour and a half. The desk had otherwise worked end to
  # end. Publishing is part of the handover, so the token has to carry it.
  actions: write

concurrency:
  group: conformance-desk
  cancel-in-progress: false

jobs:
  desk:
    # The label alone was the guard until 2026-08-19, and it silently failed on
    # the first real application. The issue form declares
    # `labels: ["conformance-row"]`, but that label did not exist in the
    # repository, so the issue arrived with no labels, this job was skipped, and
    # a submitter who did nothing wrong got no answer at all. A guard whose
    # failure mode is silence is the wrong guard for a desk that is supposed to
    # answer within a minute. The title prefix is set by the form and is not
    # something a stranger has to know about, so it catches the same issues
    # without depending on repository state that can drift. Everything a run
    # produces is still checked by scripts/vcr_row.py, so a wrong trigger costs
    # one comment explaining why, never a bad row.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'conformance-row') ||
      startsWith(github.event.issue.title, 'VCR:')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main for the scripts, the suites and the history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring the live rows over from the vcr branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin vcr >/dev/null 2>&1; then
            git fetch origin vcr:vcr
            git show vcr:vcr/reproductions.json > conformance/reproductions.json
            echo "existing rows carried over"
          else
            echo "no vcr branch yet, starting from the committed baseline"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the runner needs
        run: pip install cryptography rfc8785

      - name: Read the issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.inputs.issue || github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue view "$NUMBER" --json body,author \
            --jq '.body' > /tmp/issue.md
          author=$(gh issue view "$NUMBER" --json author --jq '.author.login')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"

      - name: Decide the row
        id: decide
        run: |
          set +e
          row=$(python scripts/vcr_row.py \
            --body /tmp/issue.md \
            --author "${{ steps.issue.outputs.author }}" \
            --date "$(date -u +%Y-%m-%d)" \
            --write 2>/tmp/why)
          code=$?
          set -e
          {
            echo "code=$code"
            echo "row<<ROW"; echo "$row"; echo "ROW"
            echo "why<<WHY"; cat /tmp/why; echo "WHY"
          } >> "$GITHUB_OUTPUT"

      - name: Say why it did not go up
        if: steps.decide.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" --body "$(cat <<'EOF'
          This one did not go up:

          > ${{ steps.decide.outputs.why }}

          Edit the issue and it will be checked again. Nothing here is a
          judgement on your run, only on what the form can verify.
          EOF
          )"

      - name: Check the chain before anything is published
        if: steps.decide.outputs.code == '0'
        # Nothing is ever removed from this table, and the desk is the only
        # thing that writes to it, so a break here means the file it carried
        # over was already damaged. Publishing over that would bury the
        # evidence of it, which is the one failure this table cannot survive.
        run: python scripts/vcr_chain.py

      - name: Render the page and the badges
        if: steps.decide.outputs.code == '0'
        run: |
          set -euo pipefail
          python scripts/conformance_runner.py --json /tmp/report.json
          python scripts/render_conformance_page.py /tmp/report.json webpage/conformance.html

      - name: Publish to the vcr branch
        if: steps.decide.outputs.code == '0'
        env:
          SLUG: ${{ fromJSON(steps.decide.outputs.row).slug }}
          ID: ${{ fromJSON(steps.decide.outputs.row).id }}
          PARTY: ${{ fromJSON(steps.decide.outputs.row).party }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vcr/vcr
          cp conformance/reproductions.json /tmp/vcr/vcr/reproductions.json
          cp webpage/conformance.html /tmp/vcr/vcr/conformance.html
          cp -r webpage/badge /tmp/vcr/vcr/badge
          git config user.name "vaara-desk"
          git config user.email "hello@vaara.io"
          # -f because the working tree still holds the regenerated page and the
          # rows carried over from vcr, and a plain checkout refuses to switch
          # over them. Everything this job publishes was copied to /tmp/vcr
          # above, so discarding the tree here loses nothing. Row #1 did not hit
          # this: the branch did not exist yet, so it took the orphan path, which
          # keeps the working tree. The next submission would have failed.
          if git ls-remote --exit-code --heads origin vcr >/dev/null 2>&1; then
            git checkout -f vcr
          else
            git checkout --orphan vcr
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          rm -rf vcr
          cp -r /tmp/vcr/vcr vcr
          git add -A vcr
          git commit -m "vcr: row #${ID}, ${PARTY}, from issue #${{ steps.issue.outputs.number }}"
          git push origin vcr

      - name: Hand over the badge and close it
        if: steps.decide.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ fromJSON(steps.decide.outputs.row).slug }}
          ID: ${{ fromJSON(steps.decide.outputs.row).id }}
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" --body "$(cat <<EOF
          You are row #${ID} at https://vaara.io/conformance.html

          Your badge, which carries the date and the commit you ran at:

          \`\`\`
          [![Vaara Conformance Results row ${ID}](https://vaara.io/badge/${SLUG}.svg)](https://vaara.io/conformance.html)
          \`\`\`

          A printable sheet of the same row, if you want one for a wall:
          https://vaara.io/badge/${SLUG}.html

          Both carry the digest of your row, and the row itself is served at
          https://vaara.io/badge/${SLUG}.json as JCS-canonical bytes, so
          \`curl -s <that url> | sha256sum\` checks either artifact against it
          without trusting us or installing anything.

          Your row number is in the badge metadata and on the page, not on the
          badge face. Rows are chained so the order exists, but a row is a
          record of a run and not a placing, and row 1 and row 250 say the same
          thing.

          The number is permanent and is never reissued, and so is the row.
          This records a run that happened, so it is not taken down later and
          nobody can take it down, including us. Rows are chained, so a removal
          would break every digest after it in public.

          The badge says you ran the checkers at that commit on that date,
          which is all it will ever say.
          EOF
          )"
          gh issue close "${{ steps.issue.outputs.number }}" --reason completed

      - name: Publish the site
        if: steps.decide.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  # Regenerate the page and every badge when the corpus itself moves, without a
  # submission to hang it off. The rows are untouched: they are read from the
  # vcr branch, rendered, and written straight back, so this changes what the
  # shield reports and never what anybody claimed.
  refresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main for the scripts and the suites
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring the live rows over from the vcr branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin vcr >/dev/null 2>&1; then
            git fetch origin vcr:vcr
            git show vcr:vcr/reproductions.json > conformance/reproductions.json
            echo "existing rows carried over"
          else
            echo "no vcr branch yet, nothing published to refresh"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the runner needs
        run: pip install cryptography rfc8785

      - name: Render the page and the badges
        run: |
          set -euo pipefail
          python scripts/conformance_runner.py --json /tmp/report.json
          python scripts/render_conformance_page.py /tmp/report.json webpage/conformance.html

      - name: Publish to the vcr branch if anything moved
        run: |
          set -euo pipefail
          mkdir -p /tmp/vcr/vcr
          cp conformance/reproductions.json /tmp/vcr/vcr/reproductions.json
          cp webpage/conformance.html /tmp/vcr/vcr/conformance.html
          cp -r webpage/badge /tmp/vcr/vcr/badge
          git config user.name "vaara-desk"
          git config user.email "hello@vaara.io"
          # -f because the working tree still holds the regenerated page and the
          # rows carried over from vcr, and a plain checkout refuses to switch
          # over them. Everything this job publishes was copied to /tmp/vcr
          # above, so discarding the tree here loses nothing. Row #1 did not hit
          # this: the branch did not exist yet, so it took the orphan path, which
          # keeps the working tree. The next submission would have failed.
          if git ls-remote --exit-code --heads origin vcr >/dev/null 2>&1; then
            git checkout -f vcr
          else
            git checkout --orphan vcr
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          rm -rf vcr
          cp -r /tmp/vcr/vcr vcr
          git add -A vcr
          # A push that touches a vector without moving a rendered byte is
          # normal, and an empty commit on every such push would bury the
          # history of actual changes.
          if git diff --cached --quiet; then
            echo "nothing moved, leaving the published site alone"
            echo "moved=no" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "vcr: refresh page and badges for ${GITHUB_SHA:0:7}"
          git push origin vcr
          echo "moved=yes" >> "$GITHUB_ENV"

      - name: Publish the site
        if: env.moved == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
